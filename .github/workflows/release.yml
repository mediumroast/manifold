name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag must match the bundle version
        run: test "${GITHUB_REF_NAME}" = "v$(cat bundles/base/VERSION)"
      - name: Lint
        run: python bundles/base/tools/build.py --check
      - name: Test, including the official Agent Skills validator
        run: |
          python -m pip install pytest "skills-ref==0.1.1"
          python -m pytest bundles/base/tests -q
      - name: Build the ZIP
        run: python bundles/base/tools/build.py --out dist
      - name: Checksums
        run: cd dist && sha256sum manifold-base-*.zip > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/manifold-base-*.zip dist/SHA256SUMS
          --title "manifold $GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
