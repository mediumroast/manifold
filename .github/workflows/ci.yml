name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    defaults:
      run:
        working-directory: bundles/base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: python tools/build.py --check
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Install the official Agent Skills validator (needs Python 3.11 or newer)
        if: matrix.python-version == '3.12'
        run: python -m pip install "skills-ref==0.1.1"
      - name: Test
        run: python -m pytest tests -q
      - name: Build the ZIP
        run: python tools/build.py --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.12'
        with:
          name: manifold-base
          path: bundles/base/dist/*.zip
