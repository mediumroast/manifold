version = 1
SPDX-PackageName = "manifold-base"

# Markdown agent, rule, fragment and template files must start with YAML
# frontmatter or are consumed verbatim, so their license is declared here
# instead of in a header comment.
[[annotations]]
path = ["agents/**", "fragments/**", "rules/**", "templates/**", "README.md", "INSTALL.md", "CONTRIBUTING.md", "VERSION", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mediumroast, Inc."
SPDX-License-Identifier = "Apache-2.0"
